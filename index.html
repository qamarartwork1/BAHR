<style>
:root{--bg:#061B29;--card:#0C3445;--cy:#24B9C7;--gold:#D7BB84;--ink:#F5F8FA;--mute:#8fb4bd;--line:#1d4a5c;--red:#F2704F;--ok:#4fc79a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0,#0C3445 0,#061B29 60%) fixed;color:var(--ink);font:400 16px/1.65 "IBM Plex Sans Arabic",Tajawal,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:92px}
h1,h2,h3{font-family:"IBM Plex Sans Arabic",Tajawal,sans-serif;font-weight:700;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.logo{font:700 30px "Reem Kufi";color:var(--gold)}.logo small{font:500 12px "IBM Plex Sans Arabic",Tajawal;color:var(--cy);margin-inline-start:6px}
.pill{border:1px solid var(--line);background:#0C344599;color:var(--ink);border-radius:99px;padding:5px 12px;font:500 13px "IBM Plex Sans Arabic",Tajawal;cursor:pointer}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}.off .pill i{background:var(--red)}
main{padding:6px 16px}
.card{background:linear-gradient(160deg,#0f3d50,#0a2d3d);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:19px;color:var(--gold);margin-bottom:6px}
.mute{color:var(--mute);font-size:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g2 .card{margin:0}
.big{font:700 26px "IBM Plex Sans Arabic",Tajawal;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;flex:1;max-width:130px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gold))}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font:700 16px "IBM Plex Sans Arabic",Tajawal;cursor:pointer;background:linear-gradient(90deg,#c9a85f,#D7BB84);color:#061B29}
.btn.c{background:var(--cy);color:#061B29}.btn.o{background:none;border:1.5px solid var(--cy);color:var(--cy)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font:500 14px "IBM Plex Sans Arabic",Tajawal;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--cy),var(--gold));color:#061B29;border-color:transparent;font-weight:700}
select,textarea,input[type=number],input:not([type]),input[type=tel],input[type=email],input[type=password]{width:100%;font:500 16px "IBM Plex Sans Arabic",Tajawal;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#082433;color:var(--ink);margin-bottom:8px}
.tag{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 9px;margin-inline-start:6px}
.demo{font-size:12px;color:var(--mute);text-align:center;margin:4px 0 10px}
svg.map{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block;background:#061B29}
.sheet{background:#0a2d3d;border:1px solid var(--gold);border-radius:18px;padding:14px;margin-top:10px}
.ring{width:84px;height:84px}.flex{display:flex;gap:12px;align-items:center}
.pod{display:flex;gap:8px;text-align:center}.pod div{flex:1;background:#0a2d3d;border:1px solid var(--line);border-radius:14px;padding:10px 4px}.pod b{display:block;color:var(--gold)}
.tgl{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tgl.on{background:var(--cy)}.tgl.on::after{inset-inline-start:23px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin-inline:auto;background:#082433f2;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mute);font:500 12px "IBM Plex Sans Arabic",Tajawal;padding:9px 0 7px;cursor:pointer}nav button.on{color:var(--cy);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
nav svg{display:block;margin:0 auto 2px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pulse{animation:p 2s infinite}@keyframes p{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.fi{width:120px;height:90px;object-fit:cover;border-radius:14px;flex:none;background:#061B29;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.th{width:48px;height:36px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-inline-end:8px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block;margin:8px 0;border:1px solid var(--line)}
.gi{flex:none;width:112px;text-align:center;font-size:13px}.gi img{width:112px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:4px}

.bd{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
#sp{position:fixed;inset:0;z-index:99;background-size:cover;background-position:center top;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px calc(32px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}#sp h2{font-size:36px;color:var(--gold)}#sp p{margin:4px 0 16px}#sp .ic{width:72px;height:72px;border-radius:18px;margin-bottom:12px}

.card{box-shadow:0 10px 28px #0005,inset 0 1px 0 #ffffff12}
.btn,.chip,nav button,.pill,.tgl{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s,color .25s}
.btn:active,.chip:active,.pill:active{transform:scale(.96)}.btn:hover{box-shadow:0 6px 18px #24b9c740}
nav button{font-size:11px;position:relative}nav button.on svg{transform:translateY(-2px)}nav svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.an>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.05s}.an>*:nth-child(3){animation-delay:.1s}.an>*:nth-child(4){animation-delay:.15s}.an>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar b{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:right}@keyframes grow{from{transform:scaleX(0)}}
#sp{animation:fade .5s both}@keyframes fade{from{opacity:0}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gold);color:#061B29;font-weight:700;padding:9px 18px;border-radius:99px;z-index:50;animation:rise .3s both;box-shadow:0 8px 24px #0006}
.pr{position:relative;padding:10px}.pr h3{font-size:15px;margin-top:8px;color:var(--ink)}.pi{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.ad{position:absolute;top:16px;inset-inline-start:16px;background:#061B29d9;border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
.sponsor{position:relative;border-color:var(--gold);text-align:center;padding-top:26px}.sponsor .ad{top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.cb{position:fixed;left:12px;right:12px;bottom:84px;max-width:536px;margin-inline:auto;background:#0C3445;border:1px solid var(--gold);border-radius:18px;padding:14px;z-index:60;font-size:14px;box-shadow:0 10px 30px #0008;animation:rise .4s both}
.hh{background-size:cover;background-position:center;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.mw{position:relative}.ov{position:absolute;background:#061B29d9;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--ink)}
.ib{width:38px;height:38px;border-radius:50%;padding:0;font-size:20px;color:var(--ink);text-align:center;line-height:34px;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8fb4bd;margin-inline-end:6px}
.tile{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background-size:cover;background-position:center;border:1px solid var(--line);display:flex;align-items:flex-end;padding:12px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tile:active{transform:scale(.97)}.tile b{display:block;font-size:16px}.tile .mute{font-size:12px}
.tile .soon{position:absolute;top:10px;inset-inline-start:10px;background:#061B29d9;border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
.mp2{position:relative;height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a2d3d;touch-action:none;user-select:none;-webkit-user-select:none}
.lay,.mk{position:absolute;inset:0}.mk{pointer-events:none}.tl{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7)}
.pin{pointer-events:auto;position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:2px solid #061B29;background:var(--cy);font-size:15px;line-height:1;padding:0;cursor:pointer;box-shadow:0 4px 12px #0007}
.pin.on{background:var(--gold);width:40px;height:40px;margin:-20px 0 0 -20px;font-size:19px}
.me{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#4aa3ff;border:3px solid #fff;box-shadow:0 0 0 6px #4aa3ff44}
.zc{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px}.zc .ib{background:#061B29e0;border:1px solid var(--line)}
.att{position:absolute;bottom:4px;right:6px;font-size:10px;color:#cfe;background:#061B29aa;padding:0 6px;border-radius:6px}
.lay2{position:absolute;inset:0;pointer-events:none}.ot{position:absolute;left:0;top:0;width:256px;height:256px;opacity:.7;pointer-events:none;background-repeat:no-repeat}
textarea{font-family:inherit;resize:vertical}
.md{position:fixed;inset:0;background:#000b;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.mb{background:var(--bg);border:1px solid var(--gold);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:rise .3s both}
.mb h3{color:var(--gold);margin-bottom:10px}
.chip[disabled],.btn[disabled]{opacity:.5;cursor:not-allowed}
</style></head><body>
